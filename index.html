<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<title>Unit Photo Files</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#152238;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--soft:#eaf1ff;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#1d4ed8,#0f766e);color:white;padding:22px 16px 18px}
header h1{margin:0;font-size:24px}header p{margin:6px 0 0;opacity:.9;font-size:13px}
main{max-width:820px;margin:auto;padding:14px 14px 40px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button,.btn{border:0;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:650;background:var(--blue);color:#fff;cursor:pointer}
button.secondary,.btn.secondary{background:var(--soft);color:#1d4ed8}
button.danger{background:#fee2e2;color:#b91c1c}
button:disabled{opacity:.45}
.breadcrumb{font-size:13px;color:var(--muted);margin:10px 0 14px;overflow-wrap:anywhere}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px #15223808}
.panel h2{font-size:18px;margin:0 0 12px}
.item{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}.item .label{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.item .sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}
.item button{padding:8px 10px;font-size:12px}
input,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:15px;background:white;color:var(--text)}
.formrow{display:flex;gap:8px}.formrow input{flex:1;min-width:0}.hint{font-size:12px;color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
.photo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.photo img{width:100%;height:155px;object-fit:contain;background:#f8fafc;display:block}
.photo .phfoot{padding:8px}.photo .phfoot p{font-size:12px;overflow-wrap:anywhere;margin:0 0 7px}
.photo .phfoot button{padding:7px 9px;font-size:12px}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14213d;color:white;padding:11px 16px;border-radius:30px;display:none;z-index:5;max-width:90vw}
dialog{border:0;border-radius:16px;max-width:90vw;padding:0;box-shadow:0 15px 60px #0004}dialog img{max-width:90vw;max-height:80vh;display:block}dialog::backdrop{background:#0f172a99}
@media(max-width:480px){header h1{font-size:21px}.formrow{flex-direction:column}.item{gap:7px}.item button{padding:8px}}
</style>
</head>
<body>
<header><h1>📘 Unit Photo Files</h1><p>Offline notebook for math questions and answers</p></header>
<main>
  <div class="toolbar">
    <button class="secondary" id="homeBtn">⌂ Home</button>
    <button class="secondary" id="backupBtn">Export Backup</button>
    <label class="btn secondary" for="restoreFile">Restore Backup</label><input id="restoreFile" type="file" accept=".json,application/json" hidden>
  </div>
  <div id="crumb" class="breadcrumb">Home</div>
  <section id="view"></section>
</main>
<footer>Saved on this device • Works offline after opening/installing</footer>
<div id="toast"></div>
<dialog id="viewer"><img id="viewerImg" alt="Saved image"></dialog>
<script>
const DB_NAME='unit-photo-files-db', STORE='photos';
let db, state={classes:[]}, path=[], currentExercise=null;
const $=id=>document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}
function saveTree(){localStorage.setItem('upf-tree-v1',JSON.stringify(state))}
function loadTree(){try{state=JSON.parse(localStorage.getItem('upf-tree-v1'))||{classes:[]}}catch{state={classes:[]}}}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)})}
function dbPut(obj){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(obj);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function dbGetAll(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbDelete(id){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function nodeList(){let arr=state.classes;if(path.length===0)return arr;let node=arr.find(x=>x.id===path[0]);for(let i=1;i<path.length;i++){if(!node)return [];let key=['chapters','units','subunits','exercises'][i-1];node=(node[key]||[]).find(x=>x.id===path[i])}return node}
const levels=[['classes','Class','chapters'],['chapters','Chapter','units'],['units','Unit','subunits'],['subunits','Subunit','exercises'],['exercises','Exercise',null]];
function currentLevel(){return path.length}
function getCollection(){if(path.length===0)return state.classes;let parent=nodeList();return parent?.[levels[path.length-1][2]]||[]}
function render(){
 const level=path.length; const names=['Home','Class','Chapter','Unit','Subunit','Exercise'];
 $('crumb').textContent=names[0]+(path.length?' / '+path.map((id,i)=>{let a=(i===0?state.classes:findParentCollection(i)).find(n=>n.id===id);return a?.name||''}).join(' / '):'');
 const view=$('view');view.innerHTML='';
 if(level<5){
  const title=level===0?'Your Classes':'Your '+names[level]+'s';
  const panel=document.createElement('div');panel.className='panel';
  const h=document.createElement('h2');h.textContent=title;panel.appendChild(h);
  const row=document.createElement('div');row.className='formrow';
  const input=document.createElement('input');input.placeholder='Enter '+names[level].toLowerCase()+' name (e.g. Class 12)';input.id='newName';
  const add=document.createElement('button');add.textContent='+ Add';add.onclick=()=>addNode(input.value.trim());
  row.append(input,add);panel.appendChild(row);
  const list=document.createElement('div');list.style.marginTop='10px';
  const items=getCollection();
  if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='Nothing here yet. Add your first '+names[level].toLowerCase()+'.';list.appendChild(e)}
  items.forEach(item=>{const el=document.createElement('div');el.className='item';
   const icon=document.createElement('span');icon.textContent=level===4?'📝':'📁';
   const label=document.createElement('div');label.className='label';label.textContent=item.name;
   const sub=document.createElement('div');sub.className='sub';sub.textContent=level===4?'Open question and answer pictures':'Tap Open to view';
   label.appendChild(sub);const open=document.createElement('button');open.textContent='Open';open.className='secondary';open.onclick=()=>{path.push(item.id);render()};
   const rename=document.createElement('button');rename.textContent='Rename';rename.className='secondary';rename.onclick=()=>{const n=prompt('New name:',item.name);if(n?.trim()){item.name=n.trim();saveTree();render()}};
   const del=document.createElement('button');del.textContent='✕';del.className='danger';del.onclick=()=>deleteNode(item);
   el.append(icon,label,open,rename,del);list.appendChild(el);
  });
  panel.appendChild(list);view.appendChild(panel);
 } else renderExercise(view,nodeList());
}
function findParentCollection(i){let n=state.classes.find(x=>x.id===path[0]);for(let j=1;j<i;j++){n=(n?.[levels[j-1][2]]||[]).find(x=>x.id===path[j])}return n?.[levels[i-1][2]]||[]}
function addNode(name){if(!name){toast('Please enter a name');return}const level=path.length;const item={id:uid(),name};if(level<4)item[levels[level][2]]=[];else item.images=[];getCollection().push(item);saveTree();render();toast('Saved')}
async function deleteNode(item){if(!confirm('Delete "'+item.name+'" and its contents?'))return;
 async function purge(n){if(n.images)for(const im of n.images)await dbDelete(im);for(const k of ['chapters','units','subunits','exercises'])for(const c of n[k]||[])await purge(c)}
 await purge(item);const arr=getCollection();const i=arr.findIndex(x=>x.id===item.id);if(i>=0)arr.splice(i,1);saveTree();render();toast('Deleted')}
function renderExercise(view,ex){
 currentExercise=ex;const panel=document.createElement('div');panel.className='panel';
 const h=document.createElement('h2');h.textContent=ex.name;panel.appendChild(h);
 const hint=document.createElement('p');hint.className='hint';hint.textContent='Add question and answer photos. Images are stored on this device.';panel.appendChild(hint);
 for(const type of ['Question','Answer']){
  const sec=document.createElement('section');sec.style.marginTop='18px';
  const h2=document.createElement('h2');h2.textContent=type+' Pictures';sec.appendChild(h2);
  const label=document.createElement('label');label.className='btn';label.style.display='inline-block';label.textContent='+ Add '+type+' Photo';
  const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;input.setAttribute('capture','environment');input.hidden=true;
  input.onchange=async()=>{for(const file of input.files){const id=uid();await dbPut({id,exerciseId:ex.id,type,blob:file,name:file.name||type+' image'});ex.images=ex.images||[];ex.images.push(id)}saveTree();render();toast('Photo saved on this device')};
  label.appendChild(input);sec.appendChild(label);
  const grid=document.createElement('div');grid.className='grid';grid.style.marginTop='12px';sec.appendChild(grid);
  const ids=(ex.images||[]);loadPhotos(ids,type,grid);
  panel.appendChild(sec);
 }
 view.appendChild(panel);
}
async function loadPhotos(ids,type,grid){const all=await dbGetAll();const photos=all.filter(p=>ids.includes(p.id)&&p.type===type);
 if(!photos.length){const e=document.createElement('div');e.className='empty';e.textContent='No '+type.toLowerCase()+' pictures saved yet.';grid.appendChild(e);return}
 photos.forEach(p=>{const card=document.createElement('div');card.className='photo';const img=document.createElement('img');const url=URL.createObjectURL(p.blob);img.src=url;img.alt=p.name;img.onclick=()=>{$('viewerImg').src=url;$('viewer').showModal()};const foot=document.createElement('div');foot.className='phfoot';const para=document.createElement('p');para.textContent=p.name;const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=async()=>{if(confirm('Delete this picture?')){await dbDelete(p.id);currentExercise.images=currentExercise.images.filter(x=>x!==p.id);saveTree();render();toast('Picture deleted')}};foot.append(para,del);card.append(img,foot);grid.appendChild(card)})}
$('viewer').addEventListener('click',()=>$('viewer').close());
$('homeBtn').onclick=()=>{path=[];render()};
$('backupBtn').onclick=async()=>{const photos=await dbGetAll();const out={format:'unit-photo-files-backup-v1',tree:state,photos:[]};for(const p of photos){out.photos.push({id:p.id,exerciseId:p.exerciseId,type:p.type,name:p.name,data:await blobToData(p.blob)})}const blob=new Blob([JSON.stringify(out)],{type:'application/json'});download(blob,'unit-photo-files-backup.json');toast('Backup exported')};
function blobToData(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('restoreFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='unit-photo-files-backup-v1')throw Error('Invalid backup');if(!confirm('Restore backup? Existing content will be replaced.'))return;const old=await dbGetAll();for(const p of old)await dbDelete(p.id);state=data.tree||{classes:[]};for(const p of data.photos||[]){const blob=await (await fetch(p.data)).blob();await dbPut({id:p.id,exerciseId:p.exerciseId,type:p.type,name:p.name,blob})}saveTree();path=[];render();toast('Backup restored')}catch(err){alert('Could not restore this backup.')}e.target.value=''};
(async()=>{loadTree();await openDB();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script>
</body>
</html>
